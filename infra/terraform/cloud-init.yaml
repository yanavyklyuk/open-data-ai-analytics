#cloud-config
package_update: true
package_upgrade: true

packages:
  - curl
  - git
  - apt-transport-https
  - ca-certificates

runcmd:
  - curl -sfL https://get.k3s.io | sh -
  - systemctl enable k3s
  - systemctl start k3s

  - until kubectl get nodes | grep -q "Ready"; do sleep 5; done

  - kubectl create namespace argocd

  - kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

  - until kubectl get pods -n argocd | grep "argocd-server" | grep -q "Running"; do sleep 10; done

  - |
    cat <<EOF > /etc/systemd/system/argocd-portforward.service
    [Unit]
    Description=Argo CD Port Forward
    After=k3s.service
    Wants=k3s.service

    [Service]
    ExecStart=/usr/local/bin/kubectl port-forward svc/argocd-server -n argocd 8080:443 --address 0.0.0.0
    Restart=always
    RestartSec=10

    [Install]
    WantedBy=multi-user.target
    EOF
  - systemctl daemon-reload
  - systemctl enable argocd-portforward
  - systemctl start argocd-portforward

  - until kubectl -n argocd get secret argocd-initial-admin-secret &>/dev/null; do sleep 5; done
  - kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d > /home/azureuser/argocd-password.txt
  - echo "" >> /home/azureuser/argocd-password.txt
  - chown azureuser:azureuser /home/azureuser/argocd-password.txt