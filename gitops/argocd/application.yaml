apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nuclear-gitops-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yanavyklyuk/open-data-ai-analytics.git
    targetRevision: HEAD
    path: gitops/app
  destination:
    server: https://kubernetes.default.svc
    namespace: nuclear-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true